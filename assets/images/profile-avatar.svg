<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36" />
      <stop offset="50%" stop-color="#142c54" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="160" fill="url(#glowGrad)" />

  <!-- Blueprint & Engineering Grid Accent Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4,4">
    <line x1="40" y1="200" x2="360" y2="200" />
    <line x1="200" y1="40" x2="200" y2="360" />
    <circle cx="200" cy="200" r="120" />
    <circle cx="200" cy="200" r="150" />
    <line x1="80" y1="80" x2="320" y2="320" />
    <line x1="320" y1="80" x2="80" y2="320" />
  </g>

  <!-- Decorative Outer Ring -->
  <circle cx="200" cy="185" r="115" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6,3" />

  <!-- Distinguished Academic & Engineering Crest -->
  <g filter="url(#dropShadow)">
    <!-- Laurel Wreath Leaves (Left) -->
    <path d="M125 150 C118 170, 118 200, 130 220 C128 210, 132 195, 138 185 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M128 125 C122 140, 126 160, 134 170 C134 160, 140 148, 144 140 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M138 105 C136 118, 142 132, 150 140 C149 130, 154 120, 160 115 Z" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Laurel Wreath Leaves (Right) -->
    <path d="M275 150 C282 170, 282 200, 270 220 C272 210, 268 195, 262 185 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M272 125 C278 140, 274 160, 266 170 C266 160, 260 148, 256 140 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M262 105 C264 118, 258 132, 250 140 C251 130, 246 120, 240 115 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Academic Cap / Mortarboard Symbol -->
    <path d="M200 95 L245 112 L200 128 L155 112 Z" fill="url(#goldGrad)" />
    <path d="M178 124 L178 142 C178 152, 222 152, 222 142 L222 124 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M245 112 L245 145 L240 148 L240 113.8 Z" fill="url(#goldGrad)" />
    <circle cx="240" cy="150" r="3" fill="#fbbf24" />

    <!-- Distinguished Silhouette -->
    <!-- Head -->
    <circle cx="200" cy="180" r="38" fill="#e2e8f0" />
    <!-- Formal Tie / Suit collar -->
    <path d="M150 252 C150 226, 175 220, 200 220 C225 220, 250 226, 250 252 L250 262 L150 262 Z" fill="#cbd5e1" />
    <path d="M192 220 L208 220 L204 252 L200 262 L196 252 Z" fill="url(#goldGrad)" />
    <!-- Suit Lapels -->
    <path d="M162 262 L185 224 L192 250 Z" fill="#1e293b" />
    <path d="M238 262 L215 224 L208 250 Z" fill="#1e293b" />
  </g>

  <!-- Drafting Compass / Structural Caliper Graphic Icon Overlay -->
  <g transform="translate(200, 312)" filter="url(#dropShadow)">
    <!-- Base Plate -->
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.8" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">
      PROFESSOR
    </text>
  </g>

  <!-- Lower Banner Institution -->
  <text x="200" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    QUEST NAWABSHAH
  </text>
  <text x="200" y="378" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="0.5">
    CIVIL ENGINEERING &amp; CONSTRUCTION MANAGEMENT
  </text>
</svg>

