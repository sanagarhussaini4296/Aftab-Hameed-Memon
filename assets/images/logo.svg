<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Base Shield / Hexagon -->
  <polygon points="50,4 92,25 92,75 50,96 8,75 8,25" fill="url(#logoBlue)" stroke="url(#logoGold)" stroke-width="3" />
  
  <!-- Engineering Truss / Triangle Network -->
  <polygon points="50,18 78,72 22,72" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.6" />
  <line x1="50" y1="18" x2="50" y2="72" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Monogram AHM -->
  <text x="50" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    AHM
  </text>
  <circle cx="50" cy="18" r="3.5" fill="#fbbf24" />
  <circle cx="22" cy="72" r="3.5" fill="#fbbf24" />
  <circle cx="78" cy="72" r="3.5" fill="#fbbf24" />
  <circle cx="50" cy="72" r="3" fill="#38bdf8" />
</svg>

